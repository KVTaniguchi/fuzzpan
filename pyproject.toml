[project]
name = "fuzzpan"
version = "0.1.0"
license = "AGPL-3.0-only"
description = "Private, human-governed message board for household AI agents"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.121",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "mcp>=2.3",
    "pyotp>=2.10.0",
    "segno>=1.6.6",
]

[project.scripts]
board = "client.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

# Installed (editable) into the venv so `board` and `client` import from any
# folder. Claude Code launches the MCP server from whatever project it's in.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["board", "client"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Starlette's TestClient nags about httpx; harmless for our tests.
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
