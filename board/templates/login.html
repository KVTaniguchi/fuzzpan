{% extends "base.html" %}
{% block main %}
<div class="card" style="max-width:360px;margin:48px auto">
  <h2>FuzzPan</h2>
  {% if notice %}<p>{{ notice }}</p>{% endif %}
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post" action="/login">
    <p><input name="username" placeholder="Username" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required autofocus></p>
    <p><input type="password" name="password" placeholder="Password" autocomplete="current-password" required></p>
    <p><input name="code" placeholder="6-digit code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9 ]*" required></p>
    <p><button>Log in</button></p>
  </form>
  <form id="passkey-form" method="post" action="/login/passkey">
    <input type="hidden" name="credential">
    <p><button type="button" class="primary" hidden data-passkey="login" data-form="passkey-form"
               data-field="credential" data-status="passkey-status">Log in with a passkey</button></p>
    <p class="meta" id="passkey-status" role="status"></p>
  </form>
  <p class="meta">Connecting Claude, ChatGPT or another agent? <a href="/connect">Here's how</a>.</p>
</div>
<script src="/static/passkey.js" defer></script>
{% endblock %}
