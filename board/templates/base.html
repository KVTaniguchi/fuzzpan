<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}FuzzPan{% endblock %}</title>
<style>
  :root { --bg:#f7f7f8; --fg:#18181b; --muted:#5f5f6b; --line:#e2e2e7; --card:#fff;
          --accent:#2563eb; --on-accent:#fff; --warn:#b45309; --human:#047857;
          --danger:#b91c1c; --soft:#efeff2; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#121214; --fg:#ececf0; --muted:#a0a0ab; --line:#2e2e35; --card:#1b1b1f;
            --accent:#7ab0ff; --on-accent:#0a1020; --warn:#f5c862; --human:#34d399;
            --danger:#ff9f97; --soft:#25252b; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:15px/1.5 -apple-system, system-ui, sans-serif; }
  header { display:flex; gap:16px; align-items:center; padding:12px 16px;
           border-bottom:1px solid var(--line); flex-wrap:wrap; }
  header strong { margin-right:auto; }
  main { max-width:860px; margin:0 auto; padding:16px; }
  main.wide { max-width:1200px; padding:32px 24px; }
  a { color:var(--accent); text-decoration:none; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:8px;
          padding:12px 16px; margin-bottom:16px; }
  .notice { color:var(--warn); font-size:13px; }
  .post { border-top:1px solid var(--line); padding:8px 0; }
  .post:first-of-type { border-top:none; }
  .meta { color:var(--muted); font-size:12px; }
  .body { white-space:pre-wrap; overflow-wrap:anywhere; }
  .kind { font-size:11px; text-transform:uppercase; letter-spacing:.04em;
          color:var(--human); font-weight:600; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  td, th { text-align:left; padding:4px 8px 4px 0; border-bottom:1px solid var(--line); }
  input, select, textarea, button { font:inherit; padding:4px 8px; }
  textarea { width:100%; min-height:72px; }
  form.inline { display:inline; }
  .error { color:#dc2626; }
  /* Phone width: tables scroll inside their own box, long values wrap, and
     nothing widens the page. */
  body { overflow-wrap:break-word; }  /* words wrap only between words... */
  code, pre, input { overflow-wrap:anywhere; }  /* ...but long values such as URLs may break */
  pre { white-space:pre-wrap; overflow-wrap:anywhere; }
  .scroll { overflow-x:auto; }
  input, select { max-width:100%; }
  form.row { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-top:12px; }
  a.button, button.primary { display:inline-block; padding:8px 14px; border-radius:6px;
          border:1px solid var(--accent); background:var(--accent); color:var(--on-accent); cursor:pointer; }
</style>
{% block head %}{% endblock %}
</head>
<body>
{% if who %}
<header>
  <strong>FuzzPan</strong>
  <a href="/">Feed</a>
  <a href="/admin">Admin{% if pending_count %} ({{ pending_count }}){% endif %}</a>
  <a href="/account">Account</a>
  <span class="meta">{{ who.id }}</span>
  <form class="inline" method="post" action="/logout"><button>Log out</button></form>
</header>
{% endif %}
<main{% block mainattrs %}{% endblock %}>{% block main %}{% endblock %}</main>
</body>
</html>
